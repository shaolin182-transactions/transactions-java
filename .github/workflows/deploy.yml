name: deploy

on:
  release:
    types: [published]

jobs:

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
      - name: Set up JDK 1.8
        uses: actions/setup-java@b6e674f4b717d7b0ae3baee0fbe79f498905dfde # v1
        with:
          java-version: 11
      - name: Login to DockerHub Registry
        run: echo ${{ secrets.DOCKERHUB_PASSWORD }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
      - name: Create docker image tag name with github release name
        id: vars
        run: echo ::set-output name=tag::$(echo ${GITHUB_REF:10})
      - name: Build image
        run: docker build . --file Dockerfile --tag jugirard/transactions-java-server:${{steps.vars.outputs.tag}} --tag jugirard/transactions-java-server:latest
      - name: Push Docker Image
        run: docker push jugirard/transactions-java-server:${{steps.vars.outputs.tag}}
      - name: Push Docker Image latest tag
        run: docker push jugirard/transactions-java-server:latest
      - name: Docker logout
        run: docker logout

